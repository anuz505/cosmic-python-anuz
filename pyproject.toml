[project]
name = "cosmic-python-anuz"
version = "0.1.0"
description = "This is a learning project where i read and implement cosmic python concepts. and i'll be creating a branch for each chapter"
authors = [
    {name = "anuj",email = "anujb364@gmail.com"}
]
readme = "README.md"

requires-python = ">=3.14,<4.0"

dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)"
]
[tool.poetry]
packages = [
    { include = "cosmic_python_anuz", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
